<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Atributos de Jugadores</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --card: #2a2a2a;
      --border: #3a3a3a;
      --text: #e0e0e0;
      --accent: #4a9eff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.8rem;
      color: #fff;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .form-section {
      background: var(--card);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
    }

    .form-section h2 {
      margin-bottom: 16px;
      font-size: 1.3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .basic-info {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .basic-info label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .basic-info input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #222;
      color: var(--text);
      font-size: 1rem;
    }

    .posiciones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      background: #222;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .pos-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }

    .pos-item:hover { background: #2f2f2f; }

    .pos-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .pos-item span { font-size: 0.95rem; }

    .attrs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 900px) {
      .attrs-grid { grid-template-columns: 1fr; }
    }

    .attr-column {
      background: #222;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .attr-column h3 {
      text-align: center;
      margin-bottom: 14px;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
    }

    .attr-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-bottom: 4px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .attr-row:hover { background: #2f2f2f; }
    .attr-row label { flex: 1; font-size: 0.95rem; }

    .attr-row input {
      width: 60px;
      padding: 6px 8px;
      text-align: center;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #1a1a1a;
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .attr-row input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
      justify-content: center;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3a8eef; }
    .btn-secondary { background: #444; color: #fff; }
    .btn-secondary:hover { background: #555; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-danger:hover { background: #e74c3c; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-success:hover { background: #2ecc71; }

    .players-list { margin-top: 40px; }
    .players-list h2 { margin-bottom: 16px; }

    .player-card {
      background: var(--card);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .player-header h3 { font-size: 1.4rem; color: #fff; }
    .player-header .pos { color: #aaa; font-size: 0.95rem; margin-top: 4px; }

    .player-actions { display: flex; gap: 8px; }
    .player-actions button { padding: 8px 14px; font-size: 0.9rem; }

    .view-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 800px) {
      .view-grid { grid-template-columns: 1fr; }
    }

    .view-column {
      background: #222;
      border-radius: 6px;
      overflow: hidden;
    }

    .view-column h4 {
      background: #333;
      padding: 8px;
      text-align: center;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #bbb;
    }

    .view-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 0.92rem;
    }

    .view-row:last-child { border-bottom: none; }
    .view-row .value { font-weight: 700; min-width: 28px; text-align: right; }

    .high { color: #4ade80; }
    .mid  { color: #fbbf24; }
    .low  { color: #f87171; }

    /* ===== ROLES ===== */
    .roles-section {
      margin-top: 20px;
      background: #1e1e1e;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .roles-section h4 {
      background: #333;
      padding: 10px 14px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #bbb;
    }

    .roles-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0;
    }

    .role-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid #2a2a2a;
      border-right: 1px solid #2a2a2a;
      font-size: 0.92rem;
    }

    .role-item .role-name { flex: 1; }
    .role-item .role-score {
      font-weight: 700;
      min-width: 48px;
      text-align: right;
      font-size: 1rem;
    }

    .score-excellent { color: #4ade80; }
    .score-good      { color: #a3e635; }
    .score-average   { color: #fbbf24; }
    .score-poor      { color: #f87171; }

    .no-roles {
      padding: 16px;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 1.1rem;
    }

    .file-input { display: none; }

    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #4ade80;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚽ Gestor de Atributos de Jugadores</h1>

    <div class="form-section">
      <h2 id="form-title">Nuevo jugador</h2>

      <div class="basic-info">
        <div>
          <label for="nombre">Nombre de jugador</label>
          <input type="text" id="nombre" placeholder="Ej: Lionel Messi" required>
        </div>

        <div>
          <label>Posición/es <small style="color:#888">(puedes marcar varias)</small></label>
          <div class="posiciones-grid" id="posicionesContainer"></div>
        </div>
      </div>

      <div class="attrs-grid">
        <!-- TÉCNICO -->
        <div class="attr-column">
          <h3>Técnico</h3>
          <div class="attr-row"><label>Cabeceo</label><input type="number" id="cabeceo" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Centros</label><input type="number" id="centros" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Control</label><input type="number" id="control" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Entradas</label><input type="number" id="entradas" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Marcaje</label><input type="number" id="marcaje" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Pases</label><input type="number" id="pases" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Penaltis</label><input type="number" id="penaltis" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Regate</label><input type="number" id="regate" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Remate</label><input type="number" id="remate" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Saques de esquina</label><input type="number" id="saques_esquina" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Saques largos</label><input type="number" id="saques_largos" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Técnica</label><input type="number" id="tecnica" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Tiros lejanos</label><input type="number" id="tiros_lejanos" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Tiros libres</label><input type="number" id="tiros_libres" min="1" max="20" value="10"></div>
        </div>

        <!-- MENTAL -->
        <div class="attr-column">
          <h3>Mental</h3>
          <div class="attr-row"><label>Agresividad</label><input type="number" id="agresividad" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Anticipación</label><input type="number" id="anticipacion" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Colocación</label><input type="number" id="colocacion" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Concentración</label><input type="number" id="concentracion" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Decisiones</label><input type="number" id="decisiones" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Desmarques</label><input type="number" id="desmarques" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Determinación</label><input type="number" id="determinacion" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Juego en equipo</label><input type="number" id="juego_equipo" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Liderazgo</label><input type="number" id="liderazgo" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Sacrificio</label><input type="number" id="sacrificio" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Serenidad</label><input type="number" id="serenidad" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Talento</label><input type="number" id="talento" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Valentía</label><input type="number" id="valentia" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Visión</label><input type="number" id="vision" min="1" max="20" value="10"></div>
        </div>

        <!-- FÍSICO -->
        <div class="attr-column">
          <h3>Físico</h3>
          <div class="attr-row"><label>Aceleración</label><input type="number" id="aceleracion" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Agilidad</label><input type="number" id="agilidad" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Alcance de salto</label><input type="number" id="alcance_salto" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Equilibrio</label><input type="number" id="equilibrio" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Fuerza</label><input type="number" id="fuerza" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Recuperación física</label><input type="number" id="recuperacion" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Resistencia</label><input type="number" id="resistencia" min="1" max="20" value="10"></div>
          <div class="attr-row"><label>Velocidad</label><input type="number" id="velocidad" min="1" max="20" value="10"></div>
        </div>
      </div>

      <div class="buttons">
        <button class="btn-primary" onclick="guardarJugador()">💾 Guardar jugador</button>
        <button class="btn-secondary" onclick="limpiarFormulario()">🗑️ Limpiar</button>
        <button class="btn-success" onclick="exportarJSON()">📥 Exportar JSON</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📤 Importar JSON</button>
        <input type="file" id="importFile" class="file-input" accept=".json" onchange="importarJSON(event)">
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="players-list">
      <h2>Jugadores guardados (<span id="count">0</span>)</h2>
      <div id="playersContainer">
        <div class="empty-state">No hay jugadores guardados todavía.</div>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       POSICIONES
       ============================================================ */
    const POSICIONES = [
      "Portero",
      "Lateral derecho",
      "Central",
      "Lateral izquierdo",
      "Carrilero derecho",
      "Centrocampista",
      "Carrilero izquierdo",
      "Medio derecho",
      "Mediocentro",
      "Medio izquierdo",
      "Extremo derecho",
      "Mediapunta",
      "Extremo izquierdo",
      "Delantero centro"
    ];

    /* ============================================================
       ATRIBUTOS
       ============================================================ */
    const ATTRS = {
      tecnico: [
        'cabeceo', 'centros', 'control', 'entradas', 'marcaje', 'pases',
        'penaltis', 'regate', 'remate', 'saques_esquina', 'saques_largos',
        'tecnica', 'tiros_lejanos', 'tiros_libres'
      ],
      mental: [
        'agresividad', 'anticipacion', 'colocacion', 'concentracion', 'decisiones',
        'desmarques', 'determinacion', 'juego_equipo', 'liderazgo', 'sacrificio',
        'serenidad', 'talento', 'valentia', 'vision'
      ],
      fisico: [
        'aceleracion', 'agilidad', 'alcance_salto', 'equilibrio',
        'fuerza', 'recuperacion', 'resistencia', 'velocidad'
      ]
    };

    const LABELS = {
      cabeceo: 'Cabeceo', centros: 'Centros', control: 'Control',
      entradas: 'Entradas', marcaje: 'Marcaje', pases: 'Pases',
      penaltis: 'Penaltis', regate: 'Regate', remate: 'Remate',
      saques_esquina: 'Saques de esquina', saques_largos: 'Saques largos',
      tecnica: 'Técnica', tiros_lejanos: 'Tiros lejanos', tiros_libres: 'Tiros libres',
      agresividad: 'Agresividad', anticipacion: 'Anticipación', colocacion: 'Colocación',
      concentracion: 'Concentración', decisiones: 'Decisiones', desmarques: 'Desmarques',
      determinacion: 'Determinación', juego_equipo: 'Juego en equipo', liderazgo: 'Liderazgo',
      sacrificio: 'Sacrificio', serenidad: 'Serenidad', talento: 'Talento',
      valentia: 'Valentía', vision: 'Visión',
      aceleracion: 'Aceleración', agilidad: 'Agilidad', alcance_salto: 'Alcance de salto',
      equilibrio: 'Equilibrio', fuerza: 'Fuerza', recuperacion: 'Recuperación física',
      resistencia: 'Resistencia', velocidad: 'Velocidad'
    };

    const ALL_ATTRS = [...ATTRS.tecnico, ...ATTRS.mental, ...ATTRS.fisico];

    /* ============================================================
       ROLES POR POSICIÓN
       ----------------------------------------------------------
       AQUÍ AÑADES TÚ LOS ROLES MANUALMENTE.

       Estructura de cada rol:
         { nombre: "Nombre del rol", atributos: ["attr1", "attr2", ...] }

       Los nombres de atributos deben coincidir exactamente con
       los de ALL_ATTRS (ej: "regate", "aceleracion", "vision"...).

       Cuando todos los atributos del rol están a 20 → valoración = 100.
       ============================================================ */
    const ROLES_POR_POSICION = {

      "Extremo derecho": [
        { nombre: "Extremo - Ap",                    atributos: [] },
        { nombre: "Extremo - At",                    atributos: [] },
        { nombre: "Delantero interior - Ap",         atributos: [] },
        { nombre: "Delantero interior - At",         atributos: [] },
        { nombre: "Extremo inverso - Ap",            atributos: [] },
        { nombre: "Extremo inverso - At",            atributos: [] },
        { nombre: "Organizador adelantado - Ap",     atributos: [] },
        { nombre: "Organizador adelantado - At",     atributos: [] },
        { nombre: "Delantero objetivo escorado - Ap",atributos: [] },
        { nombre: "Delantero objetivo escorado - At",atributos: [] },
        { nombre: "Trequartista - At",               atributos: [] },
        { nombre: "Buscador de espacios - At",       atributos: [] }
      ],

      "Extremo izquierdo": [
        // Copia y adapta los roles que necesites
      ],

      "Delantero centro": [
        // Añade aquí los roles de delantero centro
      ],

      "Mediapunta": [
        // Añade aquí los roles de mediapunta
      ],

      "Mediocentro": [
        // Añade aquí los roles de mediocentro
      ],

      "Medio derecho": [],
      "Medio izquierdo": [],
      "Centrocampista": [],
      "Carrilero derecho": [],
      "Carrilero izquierdo": [],
      "Lateral derecho": [],
      "Lateral izquierdo": [],
      "Central": [],
      "Portero": []
    };

    /* ============================================================
       LÓGICA DE VALORACIÓN DE ROLES
       ============================================================ */
    function calcularValoracionRol(jugador, atributosRol) {
      if (!atributosRol || atributosRol.length === 0) return 0;

      let suma = 0;
      let contador = 0;

      atributosRol.forEach(attr => {
        if (jugador[attr] !== undefined) {
          suma += Number(jugador[attr]) || 0;
          contador++;
        }
      });

      if (contador === 0) return 0;

      // Media sobre 20 → escala a 100
      const media = suma / contador;
      return (media / 20) * 100;
    }

    function obtenerRolesDelJugador(jugador) {
      let posiciones = jugador.posiciones || [];
      if (typeof posiciones === 'string') {
        posiciones = posiciones.split(/[,·|]/).map(s => s.trim()).filter(Boolean);
      }
      if (!Array.isArray(posiciones)) posiciones = [];

      // Recoger roles únicos (por nombre)
      const rolesMap = new Map();

      posiciones.forEach(pos => {
        const rolesDePos = ROLES_POR_POSICION[pos] || [];
        rolesDePos.forEach(rol => {
          if (!rolesMap.has(rol.nombre)) {
            const valoracion = calcularValoracionRol(jugador, rol.atributos);
            rolesMap.set(rol.nombre, {
              nombre: rol.nombre,
              valoracion: valoracion,
              atributos: rol.atributos
            });
          }
        });
      });

      // Convertir a array y ordenar de mayor a menor valoración
      return Array.from(rolesMap.values())
                  .sort((a, b) => b.valoracion - a.valoracion);
    }

    function colorScore(score) {
      if (score >= 80) return 'score-excellent';
      if (score >= 65) return 'score-good';
      if (score >= 50) return 'score-average';
      return 'score-poor';
    }

    function renderRolesHTML(jugador) {
      const roles = obtenerRolesDelJugador(jugador);

      if (roles.length === 0) {
        return `
          <div class="roles-section">
            <h4>Roles aplicables</h4>
            <div class="no-roles">No hay roles definidos para las posiciones seleccionadas (o los roles no tienen atributos todavía).</div>
          </div>
        `;
      }

      return `
        <div class="roles-section">
          <h4>Roles aplicables (ordenados por valoración)</h4>
          <div class="roles-list">
            ${roles.map(r => `
              <div class="role-item">
                <span class="role-name">${r.nombre}</span>
                <span class="role-score ${colorScore(r.valoracion)}">${r.valoracion.toFixed(1)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* ============================================================
       RESTO DE LA APLICACIÓN (sin cambios grandes)
       ============================================================ */
    let jugadores = [];
    let editandoId = null;

    function clampValor(input) {
      let v = parseInt(input.value);
      if (isNaN(v) || v < 1) v = 1;
      if (v > 20) v = 20;
      input.value = v;
    }

    function activarClampEnInputs() {
      ALL_ATTRS.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', () => clampValor(el));
        el.addEventListener('blur', () => clampValor(el));
        el.addEventListener('change', () => clampValor(el));
      });
    }

    function crearCheckboxesPosiciones() {
      const container = document.getElementById('posicionesContainer');
      container.innerHTML = POSICIONES.map((pos, i) => `
        <label class="pos-item">
          <input type="checkbox" name="posicion" value="${pos}" id="pos_${i}">
          <span>${pos}</span>
        </label>
      `).join('');
    }

    function obtenerPosicionesSeleccionadas() {
      return Array.from(document.querySelectorAll('input[name="posicion"]:checked'))
                  .map(c => c.value);
    }

    function marcarPosiciones(posiciones) {
      document.querySelectorAll('input[name="posicion"]').forEach(c => c.checked = false);
      let lista = posiciones;
      if (typeof posiciones === 'string') {
        lista = posiciones.split(/[,·|]/).map(s => s.trim()).filter(Boolean);
      }
      if (!Array.isArray(lista)) lista = [];
      lista.forEach(pos => {
        const checkbox = document.querySelector(`input[name="posicion"][value="${pos}"]`);
        if (checkbox) checkbox.checked = true;
      });
    }

    function mostrarStatus(msg, tiempo = 2500) {
      const el = document.getElementById('status');
      el.textContent = msg;
      setTimeout(() => el.textContent = '', tiempo);
    }

    function obtenerDatosFormulario() {
      ALL_ATTRS.forEach(id => {
        const el = document.getElementById(id);
        if (el) clampValor(el);
      });

      const data = {
        id: editandoId || Date.now(),
        nombre: document.getElementById('nombre').value.trim(),
        posiciones: obtenerPosicionesSeleccionadas()
      };

      ALL_ATTRS.forEach(attr => {
        data[attr] = parseInt(document.getElementById(attr).value) || 1;
      });

      return data;
    }

    function guardarJugador() {
      const data = obtenerDatosFormulario();
      if (!data.nombre) {
        alert('El nombre del jugador es obligatorio.');
        return;
      }

      if (editandoId) {
        const idx = jugadores.findIndex(j => j.id === editandoId);
        if (idx !== -1) jugadores[idx] = data;
        mostrarStatus('✅ Jugador actualizado');
      } else {
        jugadores.push(data);
        mostrarStatus('✅ Jugador guardado');
      }

      localStorage.setItem('jugadoresFM', JSON.stringify(jugadores));
      editandoId = null;
      document.getElementById('form-title').textContent = 'Nuevo jugador';
      limpiarFormulario();
      renderizarJugadores();
    }

    function limpiarFormulario() {
      document.getElementById('nombre').value = '';
      marcarPosiciones([]);
      ALL_ATTRS.forEach(attr => {
        document.getElementById(attr).value = 10;
      });
      editandoId = null;
      document.getElementById('form-title').textContent = 'Nuevo jugador';
    }

    function editarJugador(id) {
      const j = jugadores.find(p => p.id === id);
      if (!j) return;

      editandoId = id;
      document.getElementById('form-title').textContent = 'Editando: ' + j.nombre;
      document.getElementById('nombre').value = j.nombre || '';
      marcarPosiciones(j.posiciones || []);

      ALL_ATTRS.forEach(attr => {
        const el = document.getElementById(attr);
        el.value = j[attr] ?? 10;
        clampValor(el);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function eliminarJugador(id) {
      if (!confirm('¿Eliminar este jugador?')) return;
      jugadores = jugadores.filter(j => j.id !== id);
      localStorage.setItem('jugadoresFM', JSON.stringify(jugadores));
      mostrarStatus('🗑️ Jugador eliminado');
      renderizarJugadores();
    }

    function colorValor(v) {
      if (v >= 15) return 'high';
      if (v >= 10) return 'mid';
      return 'low';
    }

    function renderizarJugadores() {
      const container = document.getElementById('playersContainer');
      document.getElementById('count').textContent = jugadores.length;

      if (!jugadores || jugadores.length === 0) {
        container.innerHTML = '<div class="empty-state">No hay jugadores guardados todavía.</div>';
        return;
      }

      try {
        container.innerHTML = jugadores.map(j => {
          let posTexto = 'Sin posición';
          if (Array.isArray(j.posiciones) && j.posiciones.length > 0) {
            posTexto = j.posiciones.join(' · ');
          } else if (typeof j.posiciones === 'string' && j.posiciones.trim()) {
            posTexto = j.posiciones;
          }

          return `
            <div class="player-card">
              <div class="player-header">
                <div>
                  <h3>${j.nombre || 'Sin nombre'}</h3>
                  <div class="pos">${posTexto}</div>
                </div>
                <div class="player-actions">
                  <button class="btn-secondary" onclick="editarJugador(${j.id})">✏️ Editar</button>
                  <button class="btn-danger" onclick="eliminarJugador(${j.id})">🗑️ Eliminar</button>
                </div>
              </div>

              <div class="view-grid">
                <div class="view-column">
                  <h4>Técnico</h4>
                  ${ATTRS.tecnico.map(a => `
                    <div class="view-row">
                      <span>${LABELS[a]}</span>
                      <span class="value ${colorValor(j[a] || 1)}">${j[a] || 1}</span>
                    </div>
                  `).join('')}
                </div>
                <div class="view-column">
                  <h4>Mental</h4>
                  ${ATTRS.mental.map(a => `
                    <div class="view-row">
                      <span>${LABELS[a]}</span>
                      <span class="value ${colorValor(j[a] || 1)}">${j[a] || 1}</span>
                    </div>
                  `).join('')}
                </div>
                <div class="view-column">
                  <h4>Físico</h4>
                  ${ATTRS.fisico.map(a => `
                    <div class="view-row">
                      <span>${LABELS[a]}</span>
                      <span class="value ${colorValor(j[a] || 1)}">${j[a] || 1}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              ${renderRolesHTML(j)}
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Error al renderizar:', err);
        container.innerHTML = '<div class="empty-state">Error al mostrar jugadores.</div>';
      }
    }

    function exportarJSON() {
      if (jugadores.length === 0) {
        alert('No hay jugadores para exportar.');
        return;
      }
      const blob = new Blob([JSON.stringify(jugadores, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'jugadores_atributos.json';
      a.click();
      URL.revokeObjectURL(url);
      mostrarStatus('📥 JSON exportado');
    }

    function importarJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) throw new Error('Formato incorrecto');
          jugadores = data;
          localStorage.setItem('jugadoresFM', JSON.stringify(jugadores));
          renderizarJugadores();
          mostrarStatus('✅ JSON importado correctamente');
        } catch (err) {
          alert('Error al importar el archivo JSON.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function init() {
      try {
        jugadores = JSON.parse(localStorage.getItem('jugadoresFM') || '[]');
        if (!Array.isArray(jugadores)) jugadores = [];
      } catch (e) {
        jugadores = [];
      }

      crearCheckboxesPosiciones();
      activarClampEnInputs();
      renderizarJugadores();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
